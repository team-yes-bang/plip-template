name: Docs
description: 가이드·SQL/이벤트 문서 등을 수정합니다.
title: "[Docs] "
labels:
  - Docs

body:
  - type: markdown
    attributes:
      value: |
        유형·제목·PR 규칙은 레포 루트 `GIT_CONVENTION.md`를 참고하세요.

  - type: textarea
    id: description
    attributes:
      label: 수정 내용
      description: 어떤 문서를 왜 바꾸는지 작성해주세요.
      placeholder: 예) START.md 포트 충돌 안내 보완 / docs/events 이벤트 스펙 추가
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: 작업할 내용
      description: 수정할 파일·항목을 체크박스로 작성해주세요.
      value: |
        - [ ] 대상 문서 수정
        - [ ] 관련 링크·예시 동작 확인
    validations:
      required: true

  - type: textarea
    id: reference
    attributes:
      label: 참고 자료
      description: 관련 이슈·외부 문서 링크
      placeholder: https://... / #이슈번호
