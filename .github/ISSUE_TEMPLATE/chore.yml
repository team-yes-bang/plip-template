name: Chore
description: 빌드, CI, 의존성, 설정 등 기타 작업을 합니다.
title: "[Chore] "
labels:
  - Chore

body:
  - type: markdown
    attributes:
      value: |
        유형·제목·PR 규칙은 레포 루트 `GIT_CONVENTION.md`를 참고하세요.

  - type: textarea
    id: description
    attributes:
      label: 작업 내용
      description: 수행할 설정·인프라·의존성 작업을 작성해주세요.
      placeholder: 예) GitHub Actions cache 추가, Gradle 플러그인 버전 정리
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: 작업할 내용
      description: 할 일을 체크박스로 작성해주세요.
      value: |
        - [ ]
        - [ ]
        - [ ] `./gradlew test` 통과 확인
    validations:
      required: true

  - type: textarea
    id: reference
    attributes:
      label: 참고 자료
      description: 관련 이슈·문서 링크
      placeholder: https://... / #이슈번호
