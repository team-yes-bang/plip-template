name: Fix
description: 버그를 수정합니다.
title: "[Fix] "
labels:
  - Fix

body:
  - type: markdown
    attributes:
      value: |
        유형·제목·PR 규칙은 레포 루트 `GIT_CONVENTION.md`를 참고하세요.

  - type: textarea
    id: bug
    attributes:
      label: 버그 내용
      description: 어떤 문제가 발생하는지 작성해주세요.
      placeholder: 예) 로그인 시 401이 반복해서 발생합니다.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 재현 방법
      description: 재현 절차를 적어 주세요.
      placeholder: |
        1. ...
        2. ...
        3. 예상 / 실제 결과
    validations:
      required: false

  - type: textarea
    id: cause
    attributes:
      label: 원인
      description: 확인했거나 예상되는 원인
      placeholder: 예) JWT 만료 처리 누락으로 예상됩니다.

  - type: textarea
    id: tasks
    attributes:
      label: 수정할 내용
      description: 수정 작업을 체크박스로 작성해주세요.
      value: |
        - [ ] 원인 수정
        - [ ] 회귀 테스트
    validations:
      required: true

  - type: textarea
    id: reference
    attributes:
      label: 참고 자료
      description: 로그, 스크린샷, 관련 이슈 링크
      placeholder: 로그 / 스크린샷 / #이슈번호
