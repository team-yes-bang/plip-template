server:
  # 팀 할당 포트로 기본값 변경. 충돌 시 SERVER_PORT env로 오버라이드 (YAML보다 우선)
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/plip_template?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    enabled: false # 로컬 기본 비활성. Eureka 연동 시 true로 변경
    service-url:
      defaultZone: http://localhost:8761/eureka/
